# Nginx — Configuración de producción del Sistema de Apoyo a la Crianza.
#
# Dos responsabilidades:
#   1. /api/*  → PHP-FPM (Laravel) via FastCGI
#   2. /*      → Archivos estáticos del build de React

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name sistemaapoyoalacrianza.cloud www.sistemaapoyoalacrianza.cloud;

    # Punto de verificación de certbot (necesario para renovar el certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sistemaapoyoalacrianza.cloud$request_uri;
    }
}

# ─── Servidor principal HTTPS ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name sistemaapoyoalacrianza.cloud www.sistemaapoyoalacrianza.cloud;

    ssl_certificate     /etc/letsencrypt/live/sistemaapoyoalacrianza.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemaapoyoalacrianza.cloud/privkey.pem;

    # Parámetros SSL recomendados (sin depender del archivo de certbot)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamaño máximo de archivos subidos
    client_max_body_size 20M;

    # ── API → Laravel PHP-FPM ──────────────────────────────────────────────────
    # Todas las rutas que empiezan con /api van al backend Laravel.
    location ^~ /api {
        fastcgi_pass         app:9000;
        fastcgi_read_timeout 300;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI     $request_uri;

        include fastcgi_params;
    }

    # ── Frontend React (archivos estáticos del build) ──────────────────────────
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

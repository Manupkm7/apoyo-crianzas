# Docker Compose — Configuración de PRODUCCIÓN
#
# Diferencias con el compose.yaml de desarrollo:
#   - Sin cloudflared (el VPS tiene IP pública y dominio propio)
#   - Sin Vite dev server (el frontend se sirve como build estático)
#   - Laravel corre con PHP-FPM puro (sin Apache ni Sail)
#   - La imagen del backend se construye con deploy/Dockerfile
#   - Todos los servicios tienen restart: unless-stopped
#
# Uso:
#   docker compose -f compose.prod.yaml up -d --build
#
# Para deploy: ver deploy/deploy.sh

services:

  # ── nginx: único punto de entrada ────────────────────────────────────────
  # Sirve el frontend estático y hace de proxy hacia PHP-FPM para /api.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuración de nginx (la de producción, no la de desarrollo)
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Build estático del frontend (generado con: cd ~/proyecto-crianzas-frontend && npm run build)
      - ../proyecto-crianzas-frontend/dist:/var/www/frontend:ro
      # Certificados SSL de Let's Encrypt (después de correr certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - crianza

  # ── app: Laravel PHP-FPM ─────────────────────────────────────────────────
  # Imagen construida desde deploy/Dockerfile.
  # El código se copia dentro de la imagen al buildear (no es un volumen).
  # Para deployar nueva versión: git pull + docker compose up --build.
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    # Nombre de imagen fijo para que queue-worker reutilice EXACTAMENTE la misma
    # (se buildea una sola vez).
    image: crianza-app
    volumes:
      # El .env vive en el VPS y se monta en el contenedor (nunca se bake en la imagen)
      - ./.env:/var/www/html/.env:ro
      # Storage persistente fuera de la imagen (archivos subidos, logs)
      - laravel_storage:/var/www/html/storage/app/public
      # Disco 'local' (storage/app/private): acá caen los archivos de importación
      # masiva mientras esperan a que el queue-worker los procese. Tiene que ser
      # un volumen compartido con queue-worker, si no el job no encuentra el archivo.
      - laravel_private:/var/www/html/storage/app/private
      - laravel_logs:/var/www/html/storage/logs
    restart: unless-stopped
    depends_on:
      - pgsql
      - redis
    networks:
      - crianza

  # ── queue-worker: procesa los jobs encolados ────────────────────────────
  # Sin este servicio, QUEUE_CONNECTION=database deja las importaciones masivas
  # (ProcessImportBatch / ProcessUserImportBatch) en estado 'pending' para
  # siempre — nadie las consume.
  #
  # Reutiliza la MISMA imagen que 'app' (crianza-app), el mismo .env y el mismo
  # volumen de storage privado (donde 'app' deja el archivo subido que el job
  # tiene que leer). Solo cambia el comando: queue:work en vez de php-fpm.
  # Corre como root, igual que 'app' (su php-fpm master y los `exec app artisan`
  # del deploy): así comparte dueño con storage/logs/laravel.log y evita el
  # "Permission denied" al escribir el log.
  #
  #   --timeout=1810  : los jobs de import declaran timeout=1800 (30 min); el
  #                     worker debe tolerar al menos eso.
  #   --tries=1       : si un job falla va a failed_jobs, no se reintenta solo
  #                     (mismo criterio que declaran los jobs).
  #   --max-time=3600 : el worker se recicla cada hora (libera memoria);
  #                     restart:unless-stopped lo vuelve a levantar.
  #
  # OJO: DB_QUEUE_RETRY_AFTER en el .env debe ser MAYOR que --timeout (ya está
  # en 1900) o un job largo se re-despacha mientras todavía está corriendo.
  # Tras cada deploy hay que correr `php artisan queue:restart` para que tome
  # el código nuevo (ver deploy/deploy.sh).
  queue-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: crianza-app
    command: php artisan queue:work --tries=1 --timeout=1810 --sleep=3 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - laravel_storage:/var/www/html/storage/app/public
      - laravel_private:/var/www/html/storage/app/private
      - laravel_logs:/var/www/html/storage/logs
    restart: unless-stopped
    depends_on:
      - pgsql
      - redis
    networks:
      - crianza

  # ── pgsql: base de datos PostgreSQL ──────────────────────────────────────
  # Datos persistidos en un volumen Docker (no se pierden al reiniciar).
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_DATABASE}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - crianza
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      retries: 3
      timeout: 5s

  # ── redis: caché y sesiones ───────────────────────────────────────────────
  redis:
    image: redis:alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - crianza
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

networks:
  crianza:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  laravel_storage:
  laravel_private:
  laravel_logs:

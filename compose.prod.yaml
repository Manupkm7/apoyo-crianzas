# Docker Compose — Configuración de PRODUCCIÓN
#
# Diferencias con el compose.yaml de desarrollo:
#   - Sin cloudflared (el VPS tiene IP pública y dominio propio)
#   - Sin Vite dev server (el frontend se sirve como build estático)
#   - Laravel corre con PHP-FPM puro (sin Apache ni Sail)
#   - La imagen del backend se construye con deploy/Dockerfile
#   - Todos los servicios tienen restart: unless-stopped
#
# Uso:
#   docker compose -f compose.prod.yaml up -d --build
#
# Para deploy: ver deploy/deploy.sh

services:

  # ── nginx: único punto de entrada ────────────────────────────────────────
  # Sirve el frontend estático y hace de proxy hacia PHP-FPM para /api.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuración de nginx (la de producción, no la de desarrollo)
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Build estático del frontend (generado con: cd ~/frontend && npm run build)
      - ../frontend/dist:/var/www/frontend:ro
      # Certificados SSL de Let's Encrypt (después de correr certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - crianza

  # ── app: Laravel PHP-FPM ─────────────────────────────────────────────────
  # Imagen construida desde deploy/Dockerfile.
  # El código se copia dentro de la imagen al buildear (no es un volumen).
  # Para deployar nueva versión: git pull + docker compose up --build.
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    volumes:
      # Storage persistente fuera de la imagen (archivos subidos, logs)
      - laravel_storage:/var/www/html/storage/app/public
      - laravel_logs:/var/www/html/storage/logs
    restart: unless-stopped
    depends_on:
      - pgsql
      - redis
    networks:
      - crianza

  # ── pgsql: base de datos PostgreSQL ──────────────────────────────────────
  # Datos persistidos en un volumen Docker (no se pierden al reiniciar).
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_DATABASE}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - crianza
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      retries: 3
      timeout: 5s

  # ── redis: caché y sesiones ───────────────────────────────────────────────
  redis:
    image: redis:alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - crianza
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

networks:
  crianza:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  laravel_storage:
  laravel_logs:
